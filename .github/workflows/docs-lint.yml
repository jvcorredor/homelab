name: Docs lint

on:
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'
      - '.github/workflows/docs-lint.yml'
      - 'scripts/check-docs.sh'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check live-doc links
        run: scripts/check-docs.sh

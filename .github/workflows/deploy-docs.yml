name: Deploy docs

# Builds the Starlight site under docs/ and publishes it to GitHub Pages.
# Pull requests run the build but never deploy; deploys happen only for
# main. Diagrams are rendered from docs/diagrams/workspace.dsl with pinned
# structurizr-cli + PlantUML (scripts/build-diagrams.sh) — no generated
# assets are committed. See ADR-0010.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build-diagrams.sh'
      - 'ARCHITECTURE.md'
      - 'CONTEXT.md'
      - '.github/workflows/deploy-docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build-diagrams.sh'
      - 'ARCHITECTURE.md'
      - 'CONTEXT.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Graphviz
        run: |
          set -euo pipefail
          if ! command -v dot >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y graphviz
          fi

      - name: Render C4 diagrams
        run: scripts/build-diagrams.sh

      - name: Install site dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: ${{ github.event_name == 'push' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

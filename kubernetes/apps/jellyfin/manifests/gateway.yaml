# Jellyfin's Gateway. First use of the Gateway API floor since the
# 2026-08-09 barebones reset (ADR-0009). A single Cilium Gateway for
# the app, listening on plain HTTP (no cert-manager/DNS in the lab
# yet); the chart renders the HTTPRoute that attaches here.
#
# Pinned to 192.168.1.200 from the Cilium LB pool via lbipam, so the
# access URL is stable and documentable (issue #233).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    lbipam.cilium.io/ips: "192.168.1.200"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

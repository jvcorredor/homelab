machine:
  network:
    nameservers:
      - 192.168.1.1
    interfaces:
      - interface: eno1
        dhcp: false
        addresses:
          - 192.168.1.241/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  install:
    disk: /dev/nvme0n1
    image: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.14.0
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: worker-01
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 200GiB
---
# The Longhorn-era user volume (ADR-0005, superseded by ADR-0009) carved
# nvme0n1p5 (1.8 TiB XFS, partition label `u-longhorn`) out of this
# worker's disk. The reset tore down the volume config but left the
# partition. Re-claim it as an existing volume so Jellyfin's media
# library has a home; mounts at /var/mnt/media (issue #233). No wipe —
# the partition is clean XFS and pre-formatted.
apiVersion: v1alpha1
kind: ExistingVolumeConfig
name: media
discovery:
  volumeSelector:
    match: volume.partition_label == "u-longhorn"
